name: Random Daily Commits
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick commit count
        id: decide
        run: |
          # Picks 2, 3, or 5
          ARRAY=(2 3 5)
          SELECTED=${ARRAY[$((RANDOM % 3))]}
          echo "count=$SELECTED" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Make commits
        env:
          COMMIT_COUNT: ${{ steps.decide.outputs.count }}
        run: |
          # Ensure the file exists
          touch progress.md
          
          for i in $(seq 1 $COMMIT_COUNT); do
            # Append attempt number and current date/time to the file
            echo "Attempt $i of $COMMIT_COUNT on $(date -u +'%Y-%m-%d %H:%M:%S')" >> progress.md
            
            # Stage the change and commit immediately inside the loop
            git add progress.md
            git commit -m "Automated update $i of $COMMIT_COUNT"
          done
          
          # Push all generated commits at once to GitHub
          git pull --rebase origin main
          git push origin main

      - name: Display message
        run: echo "✓ Finished! Added ${{ steps.decide.outputs.count }} lines to progress.md and pushed ${{ steps.decide.outputs.count }} commits."
