name: Random Daily Commits
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick commit count
        id: decide
        run: |
          # Picks random number between 5 and 27
          COUNT=$((RANDOM % 23 + 5))
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Creating $COUNT commits..."

      - name: Configure git
        run: |
          git config user.name "vaillantm"
          git config user.email "manzivaillant@gmail.com"

      - name: Make commits
        env:
          COMMIT_COUNT: ${{ steps.decide.outputs.count }}
        run: |
          WORD="commits"
          FILE="word.txt"
          CURRENT=""
          MODE="add"
          DONE=0
          
          # Initialize file
          echo "$CURRENT" > $FILE
          git add $FILE
          git commit -m "Random daily commit 1/$COMMIT_COUNT: $CURRENT"
          DONE=$((DONE+1))
          
          while [ $DONE -lt $COMMIT_COUNT ]; do
            if [ "$MODE" = "add" ]; then
              # Add characters one by one
              if [ ${#CURRENT} -lt ${#WORD} ]; then
                CURRENT="${WORD:0:$((${#CURRENT}+1))}"
              else
                # Reached full word, switch to delete mode
                MODE="delete"
                continue
              fi
            else
              # Delete characters one by one
              if [ ${#CURRENT} -gt 0 ]; then
                CURRENT="${CURRENT:0:$((${#CURRENT}-1))}"
              else
                # Reached empty string, switch to add mode
                MODE="add"
                continue
              fi
            fi
            
            # Write and commit
            echo "$CURRENT" > $FILE
            git add $FILE
            git commit -m "Random daily commit $((DONE+1))/$COMMIT_COUNT: $CURRENT"
            DONE=$((DONE+1))
          done

      - name: Push changes
        run: |
          git pull --rebase origin main || true
          git push origin main

      - name: Display message
        run: echo "✓ Finished! Successfully created ${{ steps.decide.outputs.count }} animated commits."
