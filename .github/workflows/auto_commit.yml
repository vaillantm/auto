name: Random Daily Commits
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  random-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick commit count
        id: decide
        run: |
          # Picks 2, 3, or 5
          ARRAY=(2 3 5)
          SELECTED=${ARRAY[$((RANDOM % 3))]}
          echo "count=$SELECTED" >> $GITHUB_OUTPUT
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Make commits
        env:
          COMMIT_COUNT: ${{ steps.decide.outputs.count }}
        run: |
          for i in $(seq 1 $COMMIT_COUNT); do
            # Add unique content to README.md
            echo "✓ Commit attempt $i - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> README.md
            
            # Stage and commit immediately
            git add README.md
            git commit -m "Daily commit $i of $COMMIT_COUNT"
          done
          
          # Push all commits at once
          git pull --rebase origin main
          git push origin main
      - name: Display message
        run: echo "✓ Finished! Successfully created ${{ steps.decide.outputs.count }} individual commits."
