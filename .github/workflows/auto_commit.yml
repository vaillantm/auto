name: Random Daily Commits
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  random-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Configure git
        run: |
          git config user.name "vaillantm"
          git config user.email "manzivaillant@gmail.com"
      
      - name: Make commits
        run: |
          # Random commits between 3-15
          COUNT=$((RANDOM % 13 + 3))
          echo "Making $COUNT commits today"
          
          for i in $(seq 1 $COUNT); do
            echo "Commit $i at $(date)" >> activity.txt
            git add activity.txt
            git commit -m "Daily commit $i/$COUNT"
          done
      
      - name: Push changes
        run: git push
