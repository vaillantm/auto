name: Random Daily Commits
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-commits:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Pick commit count (2, 3, or 5)
      - name: Pick commit count
        id: decide
        run: |
          COUNT=$((2 + RANDOM % 4))
          if [ $COUNT -eq 4 ]; then COUNT=5; fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      # Step 3: Configure git
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Step 4: Make all commits (no delays)
      - name: Make commits
        env:
          COMMIT_COUNT: ${{ steps.decide.outputs.count }}
        run: |
          for i in $(seq 1 $COMMIT_COUNT); do
            echo "Update $i on $(date -u)" >> progress.md
            git add progress.md
            git commit -m "Automated update $i"
          done
          git push --force-with-lease

      # Step 5: Display summary
      - name: Display message
        run: echo "✓ Workflow complete! Committed ${{ steps.decide.outputs.count }} times."
